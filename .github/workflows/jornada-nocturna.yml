# Actualización de la jornada — DESDE GITHUB NO FUNCIONA
#
# La actualización nocturna de verdad NO está aquí: corre en el ordenador del
# cuerpo técnico con "scripts/jornada-nocturna.cmd", programada una sola vez
# por "scripts/instalar-tarea-nocturna.ps1".
#
# El 01/09/2026 se montó esto para que corriera solo cada noche y resultó que
# BeSoccer bloquea las IP de centro de datos: al runner de GitHub le contesta
# 406 Not Acceptable con cero bytes, mandándole las mismas cabeceras de
# navegador que sí funcionan desde una conexión doméstica. No era cosa de las
# cabeceras ni de los secretos —que estaban bien puestos—: es la IP. El propio
# script de descarga había fallado antes igual, en nueve segundos, que es lo
# que tardan sus tres reintentos.
#
# Se deja el fichero, sin horario, por dos motivos: deja constancia de por qué
# no se hace aquí, y sigue sirviendo el día que haya un runner propio en una
# máquina con conexión normal, o un proxy residencial. Se lanza sólo a mano.
#
# Si se reactiva, hacen falta dos secretos (Settings → Secrets → Actions):
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

name: Jornada nocturna (sólo a mano · BeSoccer bloquea a GitHub)

on:
  # Sin "schedule" a propósito: programado fallaba cada noche y llenaba el
  # correo de avisos de algo que no se puede arreglar desde aquí.
  workflow_dispatch:
    inputs:
      refrescar:
        description: "Volver a bajarlo todo, ignorando la caché (desmárcalo para bajar sólo lo que falte)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Dos descargas a la vez se pisarían al subir a Supabase.
  group: jornada-nocturna
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    # Son ~190 páginas de BeSoccer con pausa de 1,2 s entre ellas, más las
    # fichas de jugador. Con hora y media sobra; sin plazo, un cuelgue de
    # BeSoccer dejaría el trabajo corriendo seis horas.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      # La caché entre ejecuciones evita volver a pedir lo que no cambia: las
      # fichas de jugador de BeSoccer son las mismas todos los días salvo que
      # se haya jugado.
      - name: Recuperar la caché de descargas
        uses: actions/cache@v4
        with:
          path: .cache
          key: besoccer-${{ github.run_id }}
          restore-keys: besoccer-

      # Antes de media hora de descarga, treinta segundos de comprobación.
      #
      # Es el paso que descubrió el bloqueo: si BeSoccer nos cierra la puerta,
      # mejor saberlo aquí y con el código delante que deducirlo por el reloj.
      - name: ¿Nos deja pasar BeSoccer?
        run: |
          URL="https://es.besoccer.com/competicion/clasificacion/primera_division_rfef/2027/grupo2"

          ESTADO=$(curl -s -o /tmp/besoccer.html -w "%{http_code}" \
            --compressed --max-time 45 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml" \
            -H "Accept-Language: es-ES,es;q=0.9" \
            "$URL" || echo "000")

          BYTES=$(wc -c < /tmp/besoccer.html)

          echo "BeSoccer ha contestado $ESTADO con $BYTES bytes."

          if [ "$ESTADO" != "200" ] || [ "$BYTES" -lt 20000 ]; then
            echo "::error::BeSoccer no atiende a este runner (HTTP $ESTADO, $BYTES bytes)."
            echo "Es el bloqueo por IP de centro de datos que ya está documentado."
            echo "La descarga va en el PC del cuerpo técnico: scripts/jornada-nocturna.cmd"
            exit 1
          fi

      - name: Resultados, goleadores y alineaciones
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/rivals-informe.mjs ${{ inputs.refrescar && '--refrescar' || '' }}

      - name: Estadísticas de los jugadores rivales
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/rivals-stats.mjs ${{ inputs.refrescar && '--refrescar' || '' }}

      - name: Nuestra plantilla en BeSoccer
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/castilla-besoccer.mjs ${{ inputs.refrescar && '--refrescar' || '' }}

      - name: Qué ha quedado
        run: |
          echo "Equipos en la caché del informe:"
          ls -1 .cache/rivals-informe/*.json 2>/dev/null | wc -l
