# Opta en directo — sin el ordenador del club (09/11/2026)
#
# Lo lanza el botón «Directo» de Ajustes (POST /api/opta/directo, que llama a
# workflow_dispatch) o a mano en Actions → «Opta en directo» → Run workflow.
# Corre scripts/opta-directo.mjs: entra en Opta ProVision, mira cada minuto
# los partidos de Primera RFEF del día y deja las cifras en Supabase
# (opta:directo y opta:directo:<partido>), que la pestaña Directo de /opta lee.
#
# Secretos (Settings → Secrets and variables → Actions):
#   OPTA_USUARIO, OPTA_CLAVE           los pone el analista; nunca en el código
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   ya estaban
#
# El repo es público y estos registros se ven: el script sólo escribe recuentos.

name: Opta en directo

on:
  workflow_dispatch:
    inputs:
      duracion:
        description: "Minutos que sigue mirando (máx. 300)"
        default: "150"
      intervalo:
        description: "Segundos entre vueltas (mín. 30)"
        default: "60"
      partido:
        description: "Id de Opta de un partido (vacío = todos los de hoy)"
        default: ""

permissions:
  contents: read

concurrency:
  group: opta-directo
  cancel-in-progress: true

jobs:
  directo:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Sólo hace falta supabase-js: se instala aparte, sin el árbol entero de la web.
      - run: |
          mkdir -p "$RUNNER_TEMP/opta" && cp scripts/opta-directo.mjs "$RUNNER_TEMP/opta/"
          cd "$RUNNER_TEMP/opta" && npm init -y > /dev/null && npm install --no-audit --no-fund @supabase/supabase-js > /dev/null
      - run: node "$RUNNER_TEMP/opta/opta-directo.mjs"
        env:
          OPTA_USUARIO: ${{ secrets.OPTA_USUARIO }}
          OPTA_CLAVE: ${{ secrets.OPTA_CLAVE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DURACION_MIN: ${{ inputs.duracion }}
          INTERVALO_S: ${{ inputs.intervalo }}
          PARTIDO: ${{ inputs.partido }}
