# CodeQL · revisión de seguridad del código (14/10/2026)
#
# El analizador de GitHub lee el código buscando fallos de seguridad
# (inyecciones, datos sin limpiar que llegan a una URL o al HTML, secretos…).
# Lo que encuentra sale en la pestaña Security → Code scanning del repo.
#
# Es gratis mientras el repositorio sea público. Si se hace privado, se salta
# solo en vez de fallar (en privado es de pago).

name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore: ["public/**", "**/*.md", "videos/**"]
  pull_request:
    paths-ignore: ["public/**", "**/*.md", "videos/**"]
  schedule:
    # Los lunes a las 5:00 (hora de Madrid en invierno): pilla los fallos
    # nuevos que GitHub añade a su catálogo aunque no se haya tocado nada.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analizar:
    name: Analizar
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, actions
          queries: security-extended
          config: |
            paths-ignore:
              - public
              - videos
              - node_modules

      - uses: github/codeql-action/analyze@v4
